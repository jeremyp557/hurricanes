<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hurricanes – Match Day</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f172a; color: #f1f5f9;
    max-width: 480px; margin: 0 auto;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .hdr {
    background: linear-gradient(135deg, #166534 0%, #15803d 60%, #16a34a 100%);
    padding: 18px 20px 14px; border-bottom: 3px solid #4ade80; flex-shrink: 0;
  }
  .hdr-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 3px; opacity: 0.8; margin-bottom: 4px; }
  .hdr-title { font-size: 22px; font-weight: 700; }
  .hdr-row { display: flex; align-items: flex-end; justify-content: space-between; }
  .hdr-sub { font-size: 12px; opacity: 0.85; margin-top: 3px; }
  .hdr-badge {
    background: rgba(0,0,0,0.25); border-radius: 8px; padding: 4px 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #a7f3d0;
  }
  .nav-tabs {
    display: flex; background: #0f172a; border-bottom: 1px solid #1e293b; flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; padding: 12px 4px; border: none; background: none;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: #64748b; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .nav-btn.active { color: #4ade80; border-bottom-color: #4ade80; }
  .seg-strip {
    display: flex; gap: 6px; padding: 10px 12px 0;
    background: #0f172a; border-bottom: 1px solid #1e293b;
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  }
  .seg-strip.hidden { display: none; }
  .seg-strip::-webkit-scrollbar { display: none; }
  .seg-btn {
    flex-shrink: 0; padding: 8px 12px;
    border-radius: 8px 8px 0 0; font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 700; border: none; cursor: pointer;
    background: #1e293b; color: #64748b; transition: all 0.15s;
  }
  .seg-btn.active { background: #052e16; color: #4ade80; border-bottom: 2px solid #4ade80; }
  .seg-btn.ht-marker { position: relative; }
  .seg-btn.ht-marker::after {
    content: 'HT'; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    font-size: 8px; font-weight: 800; color: #f59e0b; letter-spacing: 0.5px;
  }
  .content { flex: 1; overflow-y: auto; padding: 14px 14px 90px; }
  .card { background: #1e293b; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .card-head {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #64748b;
    text-transform: uppercase; padding: 9px 14px; border-bottom: 1px solid #0f172a;
    display: flex; align-items: center; justify-content: space-between;
  }
  .gk-pill { background: #78350f; color: #fbbf24; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }

  /* TIME BAR */
  .time-bar {
    background: #1e293b; border-radius: 12px; margin-bottom: 10px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  }
  .time-num { font-family: 'DM Mono', monospace; font-size: 32px; font-weight: 500; color: #4ade80; line-height: 1; }
  .time-details { flex: 1; }
  .time-seg { font-size: 17px; font-weight: 700; color: #f1f5f9; }
  .time-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
  .sub-count-badge {
    background: #052e16; border: 1px solid #166534; border-radius: 8px;
    padding: 6px 10px; text-align: center;
  }
  .sub-count-num { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: #4ade80; line-height: 1; }
  .sub-count-label { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #166534; text-transform: uppercase; margin-top: 2px; }

  /* PLAYER CHIPS WITH POSITIONS */
  .player-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 12px; }
  .p-chip { background: #0f172a; border-radius: 8px; padding: 8px 4px; text-align: center; border-top: 3px solid transparent; }
  .p-chip.c-def { border-top-color: #34d399; }
  .p-chip.c-cm  { border-top-color: #818cf8; }
  .p-chip.c-fwd { border-top-color: #fb923c; }
  .p-chip.c-st  { border-top-color: #f87171; }
  .p-chip-pos { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 3px; }
  .p-chip.c-def .p-chip-pos { color: #34d399; }
  .p-chip.c-cm  .p-chip-pos { color: #818cf8; }
  .p-chip.c-fwd .p-chip-pos { color: #fb923c; }
  .p-chip.c-st  .p-chip-pos { color: #f87171; }
  .p-chip-name { font-size: 11px; font-weight: 600; line-height: 1.2; color: #e2e8f0; }

  /* PLAYER LISTS */
  .player-list { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px; }
  .p-tag {
    padding: 6px 13px; border-radius: 8px;
    font-size: 14px; font-weight: 600;
  }
  .p-tag.field { background: #0f172a; color: #e2e8f0; border: 1px solid #1e293b; }
  .p-tag.gk-tag { background: #3a1800; color: #fbbf24; border: 1px solid #78350f; }
  .p-tag.bench { background: #0f172a; color: #475569; border: 1px solid #0f172a; }

  /* SUB CARD */
  .sub-card {
    background: #1e293b; border-radius: 12px; margin-bottom: 10px;
    border: 1px solid #166534; overflow: hidden;
  }
  .sub-card.ht { border-color: #6366f1; background: #1e1b4b; }
  .sub-card-head {
    padding: 9px 14px; font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #0f172a; color: #166534;
  }
  .sub-card-head.ht { color: #818cf8; border-bottom-color: #1e1b4b; }
  .sub-time {
    font-family: 'DM Mono', monospace; background: #052e16;
    color: #4ade80; padding: 3px 10px; border-radius: 6px; font-size: 12px;
  }
  .sub-time.ht { background: #1a1040; color: #a5b4fc; }
  .sub-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  }
  .sub-row.ht-row { flex-direction: column; gap: 8px; padding: 12px 14px; }
  .sub-off {
    flex: 1; background: #450a0a; border-left: 3px solid #f87171;
    border-radius: 0 6px 6px 0; padding: 8px 12px;
    font-size: 15px; font-weight: 700; color: #fca5a5;
  }
  .sub-arrow { color: #334155; font-size: 18px; flex-shrink: 0; }
  .sub-on {
    flex: 1; background: #052e16; border-left: 3px solid #4ade80;
    border-radius: 0 6px 6px 0; padding: 8px 12px;
    font-size: 15px; font-weight: 700; color: #86efac;
  }
  .gk-swap-row {
    padding: 8px 14px 12px; font-size: 13px; color: #a5b4fc;
    display: flex; align-items: center; gap: 8px;
  }
  .ht-pairs { width: 100%; }
  .ht-pair-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ht-off { background: #450a0a; border-left: 3px solid #f87171; border-radius: 0 5px 5px 0; padding: 6px 10px; font-size: 13px; font-weight: 700; color: #fca5a5; flex: 1; }
  .ht-on  { background: #052e16; border-left: 3px solid #4ade80; border-radius: 0 5px 5px 0; padding: 6px 10px; font-size: 13px; font-weight: 700; color: #86efac; flex: 1; }
  .ht-arrow { color: #334155; flex-shrink: 0; }

  /* NO SUB */
  .no-sub { opacity: 0.4; }

  /* ALL SUBS TAB */
  .subs-wrap { padding: 14px; }
  .sub-event { display: flex; gap: 14px; margin-bottom: 16px; }
  .ev-time-col { flex-shrink: 0; width: 50px; text-align: center; padding-top: 2px; }
  .ev-time-num { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: #4ade80; line-height: 1; }
  .ev-time-unit { font-size: 10px; color: #64748b; letter-spacing: 1px; }
  .ev-body { flex: 1; }
  .ev-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #64748b; text-transform: uppercase; margin-bottom: 7px; }
  .ev-pair { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .ev-off { color: #fca5a5; }
  .ev-arr { color: #334155; }
  .ev-on  { color: #86efac; }
  .ev-note { font-size: 11px; color: #818cf8; margin-top: 4px; }
  .subs-intro {
    background: #1e293b; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
    font-size: 13px; color: #94a3b8; line-height: 1.5;
  }
  .subs-intro strong { color: #4ade80; }

  /* MINUTES TAB */
  .min-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-bottom: 1px solid #0f172a;
  }
  .min-name { width: 76px; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .min-bar-wrap { flex: 1; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; }
  .min-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .bar-gk { background: #f59e0b; }
  .bar-30 { background: #4ade80; }
  .bar-29 { background: #34d399; }
  .min-val { width: 40px; text-align: right; font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; flex-shrink: 0; }
  .min-val.gk { color: #f59e0b; }
  .min-val.v30 { color: #4ade80; }
  .min-val.v29 { color: #34d399; }
  .mins-note {
    margin: 10px; padding: 12px 14px; background: #1e293b; border-radius: 10px;
    font-size: 12px; color: #94a3b8; line-height: 1.6;
  }
  .mins-note strong { color: #f1f5f9; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: #0f172a; border-top: 1px solid #1e293b; display: flex; z-index: 100;
  }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-eyebrow">HURRICANES · MATCH DAY</div>
  <div class="hdr-row">
    <div>
      <div class="hdr-title">Rotation Planner</div>
      <div class="hdr-sub">14 players · 9 on field · 50 min · 1 sub every 4 min</div>
    </div>
    <div class="hdr-badge">12 SEGMENTS</div>
  </div>
</div>

<div class="nav-tabs">
  <button class="nav-btn active" id="navRotation" onclick="setTab('rotation')">⚽ Rotation</button>
  <button class="nav-btn" id="navSubs" onclick="setTab('subs')">🔄 All Subs</button>
  <button class="nav-btn" id="navMins" onclick="setTab('minutes')">⏱ Minutes</button>
</div>

<div class="seg-strip hidden" id="segStrip"></div>
<div class="content" id="mainContent"></div>

<div class="bottom-nav">
  <button class="nav-btn active" id="bnavRotation" onclick="setTab('rotation')">⚽ Rotation</button>
  <button class="nav-btn" id="bnavSubs" onclick="setTab('subs')">🔄 All Subs</button>
  <button class="nav-btn" id="bnavMins" onclick="setTab('minutes')">⏱ Minutes</button>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
// Seg times: 4,4,5,4,4,4 | 4,4,4,5,4,4  (5-min segs at S3 and S10)
// GK: Holly = H1 (S1-S6), Eloise P = H2 (S7-S12)
// Eloise P plays outfield in H1, Holly plays outfield in H2

const SEGS = [
  { key:'S1',  time:'0 – 4',   dur:4, half:1, gk:'Lacey',  gkNote:'GK · H1', htBefore:false },
  { key:'S2',  time:'4 – 8',   dur:4, half:1, gk:'Lacey',  gkNote:'GK · H1', htBefore:false },
  { key:'S3',  time:'8 – 13',  dur:5, half:1, gk:'Lacey',  gkNote:'GK · H1', htBefore:false },
  { key:'S4',  time:'13 – 17', dur:4, half:1, gk:'Lacey',  gkNote:'GK · H1', htBefore:false },
  { key:'S5',  time:'17 – 21', dur:4, half:1, gk:'Lacey',  gkNote:'GK · H1', htBefore:false },
  { key:'S6',  time:'21 – 25', dur:4, half:1, gk:'Lacey',  gkNote:'GK · H1', htBefore:false },
  { key:'S7',  time:'25 – 29', dur:4, half:2, gk:'Gemima',     gkNote:'GK · H2', htBefore:true  },
  { key:'S8',  time:'29 – 33', dur:4, half:2, gk:'Gemima',     gkNote:'GK · H2', htBefore:false },
  { key:'S9',  time:'33 – 37', dur:4, half:2, gk:'Gemima',     gkNote:'GK · H2', htBefore:false },
  { key:'S10', time:'37 – 42', dur:5, half:2, gk:'Gemima',     gkNote:'GK · H2', htBefore:false },
  { key:'S11', time:'42 – 46', dur:4, half:2, gk:'Gemima',     gkNote:'GK · H2', htBefore:false },
  { key:'S12', time:'46 – 50', dur:4, half:2, gk:'Gemima',     gkNote:'GK · H2', htBefore:false },
];

// On-field outfield (8 = GK-outfield + 7 regulars). GK listed separately.
// Order: GK-outfield first, then 7 regulars


// Fixed canonical order: LB, RB, CM, LF, CF, RF, ST, ST
// Only ONE name changes per segment — the subbed player's chip. All others frozen.
// GKs: Lacey (H1 goal), Gemima (H2 goal). Gemima plays outfield H1, Lacey plays outfield H2.
// Neve starts CM as required.
const FIELD = [
  [{n:'Eloise S', p:'LB',c:'def'},{n:'Holly',    p:'RB',c:'def'},{n:'Neve',    p:'CM',c:'cm'},{n:'Eloise P',p:'LF',c:'fwd'},{n:'Harper',   p:'CF',c:'fwd'},{n:'Gemima',    p:'RF',c:'fwd'},{n:'Arrabella',p:'ST',c:'st'},{n:'Georgie',  p:'ST',c:'st'}], // S1  start
  [{n:'Eloise S', p:'LB',c:'def'},{n:'Holly',    p:'RB',c:'def'},{n:'Neve',    p:'CM',c:'cm'},{n:'Eloise P',p:'LF',c:'fwd'},{n:'Harper',   p:'CF',c:'fwd'},{n:'Gemima',    p:'RF',c:'fwd'},{n:'Ella S',   p:'ST',c:'st'},{n:'Georgie',  p:'ST',c:'st'}], // S2  Arrabella→Ella S
  [{n:'Eloise S', p:'LB',c:'def'},{n:'Holly',    p:'RB',c:'def'},{n:'Neve',    p:'CM',c:'cm'},{n:'Eloise P',p:'LF',c:'fwd'},{n:'Harper',   p:'CF',c:'fwd'},{n:'Gemima',    p:'RF',c:'fwd'},{n:'Ella S',   p:'ST',c:'st'},{n:'Charli',  p:'ST',c:'st'}], // S3  Gemima→Charli
  [{n:'Isla',     p:'LB',c:'def'},{n:'Holly',    p:'RB',c:'def'},{n:'Neve',    p:'CM',c:'cm'},{n:'Eloise P',p:'LF',c:'fwd'},{n:'Harper',   p:'CF',c:'fwd'},{n:'Gemima',    p:'RF',c:'fwd'},{n:'Ella S',   p:'ST',c:'st'},{n:'Charli',  p:'ST',c:'st'}], // S4  Eloise S→Isla
  [{n:'Isla',     p:'LB',c:'def'},{n:'Holly',    p:'RB',c:'def'},{n:'Lacey',   p:'CM',c:'cm'},{n:'Eloise P',p:'LF',c:'fwd'},{n:'Harper',   p:'CF',c:'fwd'},{n:'Gemima',    p:'RF',c:'fwd'},{n:'Ella S',   p:'ST',c:'st'},{n:'Charli',  p:'ST',c:'st'}], // S5  Neve→Lacey
  [{n:'Isla',     p:'LB',c:'def'},{n:'Holly',    p:'RB',c:'def'},{n:'Lacey',   p:'CM',c:'cm'},{n:'Eloise P',p:'LF',c:'fwd'},{n:'Zhana',    p:'CF',c:'fwd'},{n:'Gemima',    p:'RF',c:'fwd'},{n:'Ella S',   p:'ST',c:'st'},{n:'Charli',  p:'ST',c:'st'}], // S6  Harper→Zhana
  [{n:'Isla',     p:'LB',c:'def'},{n:'Arrabella',p:'RB',c:'def'},{n:'Ella',   p:'CM',c:'cm'},{n:'Eloise P',p:'LF',c:'fwd'},{n:'Zhana',    p:'CF',c:'fwd'},{n:'Lacey', p:'RF',c:'fwd'},{n:'Ella S',   p:'ST',c:'st'},{n:'Charli',  p:'ST',c:'st'}], // S7  HT: Holly→Arrabella(RB), Gemima→GK, Lacey→RF
  [{n:'Isla',     p:'LB',c:'def'},{n:'Arrabella',p:'RB',c:'def'},{n:'Ella',   p:'CM',c:'cm'},{n:'Gemima',  p:'LF',c:'fwd'},{n:'Zhana',    p:'CF',c:'fwd'},{n:'Lacey', p:'RF',c:'fwd'},{n:'Ella S',   p:'ST',c:'st'},{n:'Charli',  p:'ST',c:'st'}], // S8  Eloise P→Gemima
  [{n:'Isla',     p:'LB',c:'def'},{n:'Arrabella',p:'RB',c:'def'},{n:'Ella',   p:'CM',c:'cm'},{n:'Gemima',  p:'LF',c:'fwd'},{n:'Zhana',    p:'CF',c:'fwd'},{n:'Lacey', p:'RF',c:'fwd'},{n:'Eloise S', p:'ST',c:'st'},{n:'Charli',  p:'ST',c:'st'}], // S9  Ella S→Eloise S
  [{n:'Isla',     p:'LB',c:'def'},{n:'Arrabella',p:'RB',c:'def'},{n:'Ella',   p:'CM',c:'cm'},{n:'Gemima',  p:'LF',c:'fwd'},{n:'Zhana',    p:'CF',c:'fwd'},{n:'Lacey', p:'RF',c:'fwd'},{n:'Eloise S', p:'ST',c:'st'},{n:'Neve',    p:'ST',c:'st'}], // S10 Charli→Neve
  [{n:'Harper',   p:'LB',c:'def'},{n:'Arrabella',p:'RB',c:'def'},{n:'Ella',   p:'CM',c:'cm'},{n:'Gemima',  p:'LF',c:'fwd'},{n:'Zhana',    p:'CF',c:'fwd'},{n:'Lacey', p:'RF',c:'fwd'},{n:'Eloise S', p:'ST',c:'st'},{n:'Neve',    p:'ST',c:'st'}], // S11 Isla→Harper
  [{n:'Harper',   p:'LB',c:'def'},{n:'Arrabella',p:'RB',c:'def'},{n:'Holly',   p:'CM',c:'cm'},{n:'Gemima',  p:'LF',c:'fwd'},{n:'Zhana',    p:'CF',c:'fwd'},{n:'Lacey', p:'RF',c:'fwd'},{n:'Eloise S', p:'ST',c:'st'},{n:'Neve',    p:'ST',c:'st'}], // S12 Lacey→Holly
];

const BENCH = [
  ['Ella S','Charli','Isla','Ella','Zhana'],              // S1
  ['Charli','Isla','Ella','Zhana','Arrabella'],           // S2
  ['Isla','Ella','Zhana','Arrabella','Georgie'],           // S3
  ['Ella','Zhana','Arrabella','Georgie','Eloise S'],       // S4
  ['Zhana','Arrabella','Georgie','Eloise S','Neve'],        // S5
  ['Arrabella','Georgie','Eloise S','Neve','Harper'],       // S6
  ['Georgie','Eloise S','Neve','Harper','Holly'],           // S7
  ['Eloise P','Eloise S','Neve','Harper','Holly'],         // S8
  ['Eloise P','Ella S','Neve','Harper','Holly'],           // S9
  ['Eloise P','Ella S','Charli','Harper','Holly'],         // S10
  ['Eloise P','Ella S','Charli','Isla','Holly'],           // S11
  ['Eloise P','Ella S','Charli','Isla','Ella'],           // S12
];

// Sub at END of segment (null = no sub / game ends)
const SUBS = [
  { off:'Arrabella', on:'Ella S',   atMin:'4'  },
  { off:'Georgie',   on:'Charli',   atMin:'8'  },
  { off:'Eloise S',  on:'Isla',     atMin:'13' },
  { off:'Neve',      on:'Ella',     atMin:'17' },
  { off:'Harper',    on:'Zhana',    atMin:'21' },
  { off:'Holly',     on:'Arrabella',atMin:'HT·25', isHT:true,
    gkSwap:'Lacey → Outfield  ·  Gemima → GK' },
  { off:'Eloise P',  on:'Georgie',  atMin:'29' },
  { off:'Ella S',    on:'Eloise S', atMin:'33' },
  { off:'Charli',    on:'Neve',     atMin:'37' },
  { off:'Isla',      on:'Harper',   atMin:'42' },
  { off:'Ella',      on:'Holly',    atMin:'46' },
  null, // S12 - game ends
];

const MINUTES = [
  { n:'Lacey',    m:50, cat:'gk',  note:'GK all H1 · Outfield all H2' },
  { n:'Gemima',   m:50, cat:'gk',  note:'Outfield all H1 · GK all H2' },
  { n:'Eloise S', m:30, cat:'v30', note:'S1–S3 + S9–S12  ·  both 5-min segs' },
  { n:'Neve',     m:30, cat:'v30', note:'S1–S4 + S10–S12  ·  both 5-min segs' },
  { n:'Arrabella',m:29, cat:'v29', note:'S1 + S7–S12' },
  { n:'Georgie',  m:29, cat:'v29', note:'S1–S2 + S8–S12' },
  { n:'Harper',   m:29, cat:'v29', note:'S1–S5 + S11–S12' },
  { n:'Holly',    m:29, cat:'v29', note:'S1–S6 + S12' },
  { n:'Eloise P', m:29, cat:'v29', note:'S1–S7' },
  { n:'Ella S',   m:29, cat:'v29', note:'S2–S8' },
  { n:'Charli',   m:29, cat:'v29', note:'S3–S9' },
  { n:'Isla',     m:29, cat:'v29', note:'S4–S10' },
  { n:'Ella',     m:29, cat:'v29', note:'S5–S11' },
  { n:'Zhana',    m:29, cat:'v29', note:'S6–S12' },
];

// ─── STATE ───────────────────────────────────────────────────────────────────
let activeSeg = 0;
let activeTab = 'rotation';

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderSegTabs() {
  document.getElementById('segStrip').innerHTML = SEGS.map((s,i) => {
    const div = s.htBefore
      ? `<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex-shrink:0;padding-bottom:4px;margin:0 2px;gap:2px;">
           <span style="font-size:9px;font-weight:800;letter-spacing:1px;color:#f59e0b;">HT</span>
           <div style="width:2px;height:22px;background:#f59e0b;border-radius:2px;opacity:0.5;"></div>
         </div>` : '';
    return div + `<button class="seg-btn ${i===activeSeg?'active':''}" onclick="setSeg(${i})">${s.key}</button>`;
  }).join('');
}

function renderRotation() {
  const s = SEGS[activeSeg];
  const field = FIELD[activeSeg];
  const bench = BENCH[activeSeg];
  const sub = SUBS[activeSeg];

  // GK outfield label
  const gkOutfield = s.half === 1 ? 'Gemima' : 'Lacey';

  // Time bar
  let html = `<div class="time-bar">
    <div>
      <div class="time-seg">${s.key} <span style="color:#64748b;font-size:14px;font-weight:500">· ${s.time} min</span></div>
      <div class="time-meta">Half ${s.half} · ${s.dur} min · 1 sub every segment</div>
    </div>
    <div class="sub-count-badge">
      <div class="sub-count-num">${activeSeg+1}</div>
      <div class="sub-count-label">of 12</div>
    </div>
  </div>`;

  // HT banner — S7 onwards: just a small "done" pill, not an action card
  if (s.htBefore) {
    html += `<div style="background:#1c1400;border:1px solid #78350f;border-radius:8px;padding:8px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:14px;">✅</span>
      <span style="font-size:12px;font-weight:700;color:#f59e0b;">Half time done — GK swap + Holly→Arrabella complete</span>
    </div>`;
  }

  // GK
  html += `<div class="card">
    <div class="card-head"><span>Goalkeeper</span><span class="gk-pill">${s.gk} · ${s.gkNote}</span></div>
    <div class="player-list">
      <span class="p-tag gk-tag">${s.gk}</span>
      <span class="p-tag field" style="color:#94a3b8;font-size:12px;margin-left:4px;">
        ${gkOutfield} playing outfield ↗
      </span>
    </div>
  </div>`;

  // On field
  html += `<div class="card">
    <div class="card-head"><span>On Field — Outfield (8)</span></div>
    <div class="player-grid">
      ${field.map(p => `<div class="p-chip c-${p.c}">
        <div class="p-chip-pos">${p.p}</div>
        <div class="p-chip-name">${p.n}</div>
      </div>`).join('')}
    </div>
  </div>`;

  // Bench
  html += `<div class="card">
    <div class="card-head"><span>Bench (5)</span></div>
    <div class="player-list">
      ${bench.map(n => `<span class="p-tag bench">${n}</span>`).join('')}
    </div>
  </div>`;

  // Sub card
  if (!sub) {
    html += `<div class="sub-card no-sub">
      <div class="sub-card-head"><span>No more subs — game ends at 50 min</span></div>
    </div>`;
  } else if (sub.isHT) {
    html += `<div class="sub-card ht">
      <div class="sub-card-head ht">
        <span>⚡ DO AT HALF TIME — blow whistle, subs, restart</span>
        <span class="sub-time ht">25 min</span>
      </div>
      <div style="padding:10px 14px 4px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:1px;color:#818cf8;text-transform:uppercase;margin-bottom:7px;">Regular Sub</div>
        <div class="sub-row" style="padding:0 0 10px;">
          <div class="sub-off">← ${sub.off}</div>
          <div class="sub-arrow">→</div>
          <div class="sub-on">→ ${sub.on}</div>
        </div>
        <div style="font-size:10px;font-weight:700;letter-spacing:1px;color:#818cf8;text-transform:uppercase;margin-bottom:7px;">GK Swap</div>
      </div>
      <div class="gk-swap-row">🥅 ${sub.gkSwap}</div>
    </div>`;
  } else {
    html += `<div class="sub-card">
      <div class="sub-card-head">
        <span>Sub at end of ${s.key}</span>
        <span class="sub-time">${sub.atMin} min</span>
      </div>
      <div class="sub-row">
        <div class="sub-off">← ${sub.off}</div>
        <div class="sub-arrow">→</div>
        <div class="sub-on">→ ${sub.on}</div>
      </div>
    </div>`;
  }

  // Next up nav
  if (activeSeg < 11) {
    const next = SEGS[activeSeg+1];
    html += `<button onclick="setSeg(${activeSeg+1})" style="
      width:100%;padding:13px;background:#1e293b;border:none;
      border-radius:10px;color:#64748b;font-family:'DM Sans',sans-serif;
      font-size:14px;font-weight:600;cursor:pointer;text-align:center;
    ">Next: ${next.key} (${next.time} min) →</button>`;
  }

  return html;
}

function renderSubs() {
  let html = `<div class="subs-wrap">`;
  html += `<div class="subs-intro">
    <strong>1 sub per window.</strong> Every ~4 minutes, one player comes off and one comes on.
    Bench stays at 5 the entire game. All regulars get <strong>29–30 min</strong> of equal game time.
    GKs earn <strong>50 min</strong> for volunteering in goal.
  </div>`;

  SUBS.forEach((sub, i) => {
    if (!sub) return;
    const isLast = i === 10;
    html += `<div class="sub-event">
      <div class="ev-time-col">
        <div class="ev-time-num">${sub.atMin.replace('HT·','')}</div>
        <div class="ev-time-unit">${sub.atMin.includes('HT') ? 'HT' : 'MIN'}</div>
      </div>
      <div class="ev-body">
        <div class="ev-label">Sub ${i+1} of 11${sub.isHT?' · Half Time':''}</div>
        <div class="ev-pair">
          <span class="ev-off">← ${sub.off}</span>
          <span class="ev-arr"> → </span>
          <span class="ev-on">${sub.on}</span>
        </div>
        ${sub.isHT ? `<div class="ev-note">🥅 ${sub.gkSwap}</div>` : ''}
      </div>
    </div>`;
  });

  html += `</div>`;
  return html;
}

function renderMinutes() {
  let html = `<div class="card" style="border-radius:12px;">`;
  MINUTES.forEach(p => {
    const pct = (p.m / 50) * 100;
    const bc = p.cat==='gk' ? 'bar-gk' : p.cat==='v30' ? 'bar-30' : 'bar-29';
    const vc = p.cat==='gk' ? 'gk' : p.cat==='v30' ? 'v30' : 'v29';
    html += `<div class="min-row">
      <div class="min-name">${p.n}</div>
      <div style="flex:1;">
        <div class="min-bar-wrap"><div class="min-bar ${bc}" style="width:${pct}%"></div></div>
        <div style="font-size:10px;color:#475569;margin-top:2px;">${p.note}</div>
      </div>
      <div class="min-val ${vc}">${p.m}'</div>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="mins-note">
    <strong>GKs (Holly + Eloise P):</strong> 50 min each — GK their half, outfield the other. Earned for volunteering.<br><br>
    <strong>Eloise S + Neve:</strong> 30 min — they happen to play both 5-minute segments. 1 min above the group.<br><br>
    <strong>Everyone else:</strong> 29 min each — genuinely equal. Rotate who occupies the "first off" position each game if needed.<br><br>
    <strong>Gap:</strong> 1 minute between best and worst among regulars. Essentially equal.
  </div>`;
  return html;
}

// ─── MAIN ────────────────────────────────────────────────────────────────────
function render() {
  renderSegTabs();
  const strip = document.getElementById('segStrip');
  strip.classList.toggle('hidden', activeTab !== 'rotation');

  const mc = document.getElementById('mainContent');
  if (activeTab === 'rotation') mc.innerHTML = renderRotation();
  else if (activeTab === 'subs') mc.innerHTML = renderSubs();
  else mc.innerHTML = renderMinutes();
}

function setSeg(i) {
  activeSeg = i; render();
  const btns = document.querySelectorAll('.seg-btn');
  if (btns[i]) btns[i].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function setTab(t) {
  activeTab = t;
  ['Rotation','Subs','Mins'].forEach(x => {
    const key = x==='Mins'?'minutes':x.toLowerCase();
    const el = document.getElementById('nav'+x);
    const bel = document.getElementById('bnav'+x);
    if(el) el.classList.toggle('active', key===t);
    if(bel) bel.classList.toggle('active', key===t);
  });
  render();
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hurricanes – Match Day</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f172a; color: #f1f5f9;
    max-width: 480px; margin: 0 auto;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .hdr {
    background: linear-gradient(135deg, #166534 0%, #15803d 60%, #16a34a 100%);
    padding: 18px 20px 14px; border-bottom: 3px solid #4ade80; flex-shrink: 0;
  }
  .hdr-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 3px; opacity: 0.8; margin-bottom: 4px; }
  .hdr-title { font-size: 22px; font-weight: 700; }
  .hdr-row { display: flex; align-items: flex-end; justify-content: space-between; }
  .hdr-sub { font-size: 12px; opacity: 0.85; margin-top: 3px; }
  .hdr-badge {
    background: rgba(0,0,0,0.25); border-radius: 8px; padding: 4px 10px;
    font-size: 11px; font-weight: 700; letter-spacing: 1px; color: #a7f3d0;
  }


  /* ── Plan switcher ── */
  .plan-switch { display:flex; gap:8px; padding:10px 12px 4px; max-width:640px; margin:0 auto; }
  .ps-btn { flex:1; background:#111a2e; border:1px solid #24304a; color:#8291ab; border-radius:11px; padding:10px 6px; font-size:13px; font-weight:800; line-height:1.25; }
  .ps-btn span { display:block; font-size:10px; font-weight:600; opacity:0.8; margin-top:2px; }
  .ps-btn.active { background:linear-gradient(135deg,#0e7490,#0369a1); color:#fff; border-color:transparent; box-shadow:0 2px 10px rgba(3,105,161,0.4); }
  /* ── Pitch formation view ── */
  .pitch-wrap { padding:0 2px 8px; }
  .pitch-toggle { display:flex; gap:6px; margin-bottom:10px; }
  .pt-btn { flex:1; background:#16203a; border:1px solid #283047; color:#94a3b8; border-radius:9px; padding:9px 4px; font-size:12px; font-weight:800; letter-spacing:0.4px; }
  .pt-btn.active { background:linear-gradient(135deg,#7c3aed,#4f46e5); color:#fff; border-color:transparent; }
  .pitch { position:relative; width:100%; aspect-ratio:7/10; border-radius:14px; overflow:hidden;
    background:repeating-linear-gradient(0deg,#2f9e44 0,#2f9e44 10%,#37b24d 10%,#37b24d 20%);
    border:1px solid #14532d; box-shadow:inset 0 0 0 2px rgba(255,255,255,0.12); }
  .pitch-line { position:absolute; background:rgba(255,255,255,0.45); }
  .pl-half { left:0; right:0; top:50%; height:2px; }
  .pl-circle { left:50%; top:50%; width:34%; aspect-ratio:1; border:2px solid rgba(255,255,255,0.45); border-radius:50%; transform:translate(-50%,-50%); background:transparent; }
  .pl-box-top { left:28%; right:28%; top:0; height:13%; border:2px solid rgba(255,255,255,0.4); border-top:none; }
  .pl-box-bot { left:28%; right:28%; bottom:0; height:13%; border:2px solid rgba(255,255,255,0.4); border-bottom:none; }
  .pp { position:absolute; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:3px; width:80px; }
  .pp-bubble { width:62px; height:62px; border-radius:50%; background:#1971c2; border:3px solid #1864ab;
    display:flex; align-items:center; justify-content:center; text-align:center; color:#fff; font-size:12.5px; font-weight:800; line-height:1.05; box-shadow:0 2px 6px rgba(0,0,0,0.35); padding:2px; }
  .pp-bubble.gk { background:#e8590c; border-color:#d9480f; }
  .pp-bubble.gkout { background:#1971c2; border-color:#f59e0b; }
  .pp-pos { background:#fff; color:#0f172a; font-size:9px; font-weight:800; letter-spacing:0.5px; padding:1px 7px; border-radius:8px; }
  .pitch-bench { margin-top:10px; }
  .pitch-bench-lbl { font-size:10px; font-weight:800; letter-spacing:1.2px; color:#64748b; text-transform:uppercase; margin:0 2px 7px; }
  .pb-row { display:flex; flex-wrap:wrap; gap:7px; }
  .pb-chip { display:flex; flex-direction:column; align-items:center; gap:4px; }
  .pb-bubble { width:46px; height:46px; border-radius:50%; background:#1c2638; border:2px solid #2a3a55; display:flex; align-items:center; justify-content:center; text-align:center; color:#cbd5e1; font-size:10px; font-weight:700; line-height:1.05; padding:2px; }
  .pitch-cap { text-align:center; font-size:11px; color:#64748b; font-weight:600; margin-top:8px; }
  .nav-tabs {
    display: flex; background: #0f172a; border-bottom: 1px solid #1e293b; flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; padding: 12px 4px; border: none; background: none;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 12px;
    letter-spacing: 0.5px; text-transform: uppercase;
    color: #64748b; cursor: pointer; border-bottom: 2px solid transparent;
  }
  .nav-btn.active { color: #4ade80; border-bottom-color: #4ade80; }
  .seg-strip {
    display: flex; gap: 6px; padding: 10px 12px 0;
    background: #0f172a; border-bottom: 1px solid #1e293b;
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  }
  .seg-strip.hidden { display: none; }
  .seg-strip::-webkit-scrollbar { display: none; }
  .seg-btn {
    flex-shrink: 0; padding: 8px 12px;
    border-radius: 8px 8px 0 0; font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 700; border: none; cursor: pointer;
    background: #1e293b; color: #64748b; transition: all 0.15s;
  }
  .seg-btn.active { background: #052e16; color: #4ade80; border-bottom: 2px solid #4ade80; }
  .seg-btn.ht-marker { position: relative; }
  .seg-btn.ht-marker::after {
    content: 'HT'; position: absolute; top: -8px; left: 50%; transform: translateX(-50%);
    font-size: 8px; font-weight: 800; color: #f59e0b; letter-spacing: 0.5px;
  }
  .content { flex: 1; overflow-y: auto; padding: 14px 14px 90px; }
  .card { background: #1e293b; border-radius: 12px; margin-bottom: 10px; overflow: hidden; }
  .card-head {
    font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #64748b;
    text-transform: uppercase; padding: 9px 14px; border-bottom: 1px solid #0f172a;
    display: flex; align-items: center; justify-content: space-between;
  }
  .gk-pill { background: #78350f; color: #fbbf24; padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }

  /* TIME BAR */
  .time-bar {
    background: #1e293b; border-radius: 12px; margin-bottom: 10px;
    padding: 12px 14px; display: flex; align-items: center; gap: 12px;
  }
  .time-num { font-family: 'DM Mono', monospace; font-size: 32px; font-weight: 500; color: #4ade80; line-height: 1; }
  .time-details { flex: 1; }
  .time-seg { font-size: 17px; font-weight: 700; color: #f1f5f9; }
  .time-meta { font-size: 12px; color: #64748b; margin-top: 2px; }
  .sub-count-badge {
    background: #052e16; border: 1px solid #166534; border-radius: 8px;
    padding: 6px 10px; text-align: center;
  }
  .sub-count-num { font-family: 'DM Mono', monospace; font-size: 20px; font-weight: 500; color: #4ade80; line-height: 1; }
  .sub-count-label { font-size: 9px; font-weight: 700; letter-spacing: 1px; color: #166534; text-transform: uppercase; margin-top: 2px; }

  /* PLAYER CHIPS WITH POSITIONS */
  .player-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; padding: 12px; }
  .p-chip { background: #0f172a; border-radius: 8px; padding: 8px 4px; text-align: center; border-top: 3px solid transparent; }
  .p-chip.c-def { border-top-color: #34d399; }
  .p-chip.c-cm  { border-top-color: #818cf8; }
  .p-chip.c-fwd { border-top-color: #fb923c; }
  .p-chip.c-st  { border-top-color: #f87171; }
  .p-chip-pos { font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 3px; }
  .p-chip.c-def .p-chip-pos { color: #34d399; }
  .p-chip.c-cm  .p-chip-pos { color: #818cf8; }
  .p-chip.c-fwd .p-chip-pos { color: #fb923c; }
  .p-chip.c-st  .p-chip-pos { color: #f87171; }
  .p-chip-name { font-size: 11px; font-weight: 600; line-height: 1.2; color: #e2e8f0; }

  /* PLAYER LISTS */
  .player-list { display: flex; flex-wrap: wrap; gap: 7px; padding: 12px; }
  .p-tag {
    padding: 6px 13px; border-radius: 8px;
    font-size: 14px; font-weight: 600;
  }
  .p-tag.field { background: #0f172a; color: #e2e8f0; border: 1px solid #1e293b; }
  .p-tag.gk-tag { background: #3a1800; color: #fbbf24; border: 1px solid #78350f; }
  .p-tag.bench { background: #0f172a; color: #475569; border: 1px solid #0f172a; }

  /* SUB CARD */
  .sub-card {
    background: #1e293b; border-radius: 12px; margin-bottom: 10px;
    border: 1px solid #166534; overflow: hidden;
  }
  .sub-card.ht { border-color: #6366f1; background: #1e1b4b; }
  .sub-card-head {
    padding: 9px 14px; font-size: 10px; font-weight: 700;
    letter-spacing: 1.5px; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #0f172a; color: #166534;
  }
  .sub-card-head.ht { color: #818cf8; border-bottom-color: #1e1b4b; }
  .sub-time {
    font-family: 'DM Mono', monospace; background: #052e16;
    color: #4ade80; padding: 3px 10px; border-radius: 6px; font-size: 12px;
  }
  .sub-time.ht { background: #1a1040; color: #a5b4fc; }
  .sub-row {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  }
  .sub-row.ht-row { flex-direction: column; gap: 8px; padding: 12px 14px; }
  .sub-off {
    flex: 1; background: #450a0a; border-left: 3px solid #f87171;
    border-radius: 0 6px 6px 0; padding: 8px 12px;
    font-size: 15px; font-weight: 700; color: #fca5a5;
  }
  .sub-arrow { color: #334155; font-size: 18px; flex-shrink: 0; }
  .sub-on {
    flex: 1; background: #052e16; border-left: 3px solid #4ade80;
    border-radius: 0 6px 6px 0; padding: 8px 12px;
    font-size: 15px; font-weight: 700; color: #86efac;
  }
  .gk-swap-row {
    padding: 8px 14px 12px; font-size: 13px; color: #a5b4fc;
    display: flex; align-items: center; gap: 8px;
  }
  .ht-pairs { width: 100%; }
  .ht-pair-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .ht-off { background: #450a0a; border-left: 3px solid #f87171; border-radius: 0 5px 5px 0; padding: 6px 10px; font-size: 13px; font-weight: 700; color: #fca5a5; flex: 1; }
  .ht-on  { background: #052e16; border-left: 3px solid #4ade80; border-radius: 0 5px 5px 0; padding: 6px 10px; font-size: 13px; font-weight: 700; color: #86efac; flex: 1; }
  .ht-arrow { color: #334155; flex-shrink: 0; }

  /* NO SUB */
  .no-sub { opacity: 0.4; }

  /* ALL SUBS TAB */
  .subs-wrap { padding: 14px; }
  .sub-event { display: flex; gap: 14px; margin-bottom: 16px; }
  .ev-time-col { flex-shrink: 0; width: 50px; text-align: center; padding-top: 2px; }
  .ev-time-num { font-family: 'DM Mono', monospace; font-size: 22px; font-weight: 500; color: #4ade80; line-height: 1; }
  .ev-time-unit { font-size: 10px; color: #64748b; letter-spacing: 1px; }
  .ev-body { flex: 1; }
  .ev-label { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; color: #64748b; text-transform: uppercase; margin-bottom: 7px; }
  .ev-pair { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 600; }
  .ev-off { color: #fca5a5; }
  .ev-arr { color: #334155; }
  .ev-on  { color: #86efac; }
  .ev-note { font-size: 11px; color: #818cf8; margin-top: 4px; }
  .subs-intro {
    background: #1e293b; border-radius: 10px; padding: 12px 14px; margin-bottom: 14px;
    font-size: 13px; color: #94a3b8; line-height: 1.5;
  }
  .subs-intro strong { color: #4ade80; }

  /* MINUTES TAB */
  .min-row {
    display: flex; align-items: center; gap: 10px;
    padding: 8px 14px; border-bottom: 1px solid #0f172a;
  }
  .min-name { width: 76px; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .min-bar-wrap { flex: 1; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden; }
  .min-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .bar-gk { background: #f59e0b; }
  .bar-30 { background: #4ade80; }
  .bar-29 { background: #34d399; }
  .min-val { width: 40px; text-align: right; font-family: 'DM Mono', monospace; font-size: 14px; font-weight: 500; flex-shrink: 0; }
  .min-val.gk { color: #f59e0b; }
  .min-val.v30 { color: #4ade80; }
  .min-val.v29 { color: #34d399; }
  .mins-note {
    margin: 10px; padding: 12px 14px; background: #1e293b; border-radius: 10px;
    font-size: 12px; color: #94a3b8; line-height: 1.6;
  }
  .mins-note strong { color: #f1f5f9; }

  /* BOTTOM NAV */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: #0f172a; border-top: 1px solid #1e293b; display: flex; z-index: 100;
  }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-eyebrow">HURRICANES · MATCH DAY</div>
  <div class="hdr-row">
    <div>
      <div class="hdr-title">Rotation Planner</div>
      <div class="hdr-sub" id="hdrSub">12 players · 9 on field · 2×25 min · bench = 3</div>
    </div>
    <div class="hdr-badge" id="hdrBadge">BENCH 3</div>
  </div>
</div>

<div class="plan-switch">
  <button class="ps-btn active" id="psA" onclick="switchPlan('A')">✅ Isla IN<br><span>12 players · bench 3</span></button>
  <button class="ps-btn" id="psB" onclick="switchPlan('B')">❌ Isla OUT<br><span>11 players · bench 2</span></button>
</div>
<div class="nav-tabs">
  <button class="nav-btn active" id="navRotation" onclick="setTab('rotation')">⚽ Rotation</button>
  <button class="nav-btn" id="navPitch" onclick="setTab('pitch')">📋 Pitch</button>
  <button class="nav-btn" id="navSubs" onclick="setTab('subs')">🔄 All Subs</button>
  <button class="nav-btn" id="navMins" onclick="setTab('minutes')">⏱ Minutes</button>
</div>

<div class="seg-strip hidden" id="segStrip"></div>
<div class="content" id="mainContent"></div>

<div class="bottom-nav">
  <button class="nav-btn active" id="bnavRotation" onclick="setTab('rotation')">⚽ Rotation</button>
  <button class="nav-btn" id="bnavPitch" onclick="setTab('pitch')">📋 Pitch</button>
  <button class="nav-btn" id="bnavSubs" onclick="setTab('subs')">🔄 All Subs</button>
  <button class="nav-btn" id="bnavMins" onclick="setTab('minutes')">⏱ Minutes</button>
</div>

<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
// Seg times: 4,4,5,4,4,4 | 4,4,4,5,4,4  (5-min segs at S3 and S10)
// GK: Holly = H1 (S1-S6), Eloise P = H2 (S7-S12)
// Eloise P plays outfield in H1, Holly plays outfield in H2

// Shared segment shape (same for both plans): 5 x 10 min, GK Neve H1 / Ella S H2, HT mid-S3
const SEGS = [
  { key:'S1', time:'0 – 10',  dur:10, half:1, gk:'Neve',   gkNote:'GK · H1', htBefore:false, htMid:false },
  { key:'S2', time:'10 – 20', dur:10, half:1, gk:'Neve',   gkNote:'GK · H1', htBefore:false, htMid:false },
  { key:'S3', time:'20 – 30', dur:10, half:1, gk:'Neve',   gkNote:'GK · H1', htBefore:false, htMid:true  },
  { key:'S4', time:'30 – 40', dur:10, half:2, gk:'Ella S', gkNote:'GK · H2', htBefore:false, htMid:false },
  { key:'S5', time:'40 – 50', dur:10, half:2, gk:'Ella S', gkNote:'GK · H2', htBefore:false, htMid:false },
];

// ══ PLAN A — Isla IN · 12 players · bench 3 ══════════════════════════════════
const PLAN_A = {
  label:'Isla IN', sub:'12 players · bench 3', badge:'BENCH 3',
  field:[
    [{n:'Zhana',   p:'LB',c:'def'},{n:'Lacey',   p:'RB',c:'def'},{n:'Holly', p:'CM',c:'cm'},{n:'Charli', p:'LF',c:'fwd'},{n:'Gemima', p:'CF',c:'fwd'},{n:'Ella',   p:'RF',c:'fwd'},{n:'Arrabella',p:'ST',c:'st'},{n:'Ella S',  p:'ST',c:'st'}], // S1
    [{n:'Eloise S',p:'LB',c:'def'},{n:'Lacey',   p:'RB',c:'def'},{n:'Holly', p:'CM',c:'cm'},{n:'Charli', p:'LF',c:'fwd'},{n:'Georgie',p:'CF',c:'fwd'},{n:'Isla',   p:'RF',c:'fwd'},{n:'Zhana',   p:'ST',c:'st'},{n:'Ella S',  p:'ST',c:'st'}], // S2  Arrabella→Zhana(ST) · Ella→Isla · Gemima→Georgie · Eloise S in at LB
    [{n:'Eloise S',p:'LB',c:'def'},{n:'Lacey',   p:'RB',c:'def'},{n:'Holly', p:'CM',c:'cm'},{n:'Charli', p:'LF',c:'fwd'},{n:'Georgie',p:'CF',c:'fwd'},{n:'Isla',   p:'RF',c:'fwd'},{n:'Gemima',  p:'ST',c:'st'},{n:'Ella S',  p:'ST',c:'st'}], // S3  Zhana→Gemima · HT mid-seg
    [{n:'Ella',    p:'LB',c:'def'},{n:'Lacey',  p:'RB',c:'def'},{n:'Neve',  p:'CM',c:'cm'},{n:'Arrabella',p:'LF',c:'fwd'},{n:'Georgie',p:'CF',c:'fwd'},{n:'Isla',  p:'RF',c:'fwd'},{n:'Gemima',  p:'ST',c:'st'},{n:'Zhana',   p:'ST',c:'st'}], // S4  Charli→Zhana · Holly→Ella · GK swap · Neve to CM
    [{n:'Zhana',   p:'LB',c:'def'},{n:'Charli',  p:'RB',c:'def'},{n:'Neve', p:'CM',c:'cm'},{n:'Ella',   p:'LF',c:'fwd'},{n:'Georgie',p:'CF',c:'fwd'},{n:'Eloise S',p:'RF',c:'fwd'},{n:'Gemima', p:'ST',c:'st'},{n:'Arrabella',p:'ST',c:'st'}], // S5  Isla→Eloise S · Lacey→Charli · Arrabella up top
  ],
  bench:[
    ['Eloise S','Georgie','Isla'],    // S1
    ['Arrabella','Ella','Gemima'],    // S2
    ['Arrabella','Ella','Zhana'],     // S3
    ['Charli','Eloise S','Holly'],    // S4
    ['Holly','Isla','Lacey'],         // S5
  ],
  subs:[
    { off3:['Arrabella','Ella','Gemima'], on3:['Zhana','Isla','Georgie'],  atMin:'10', count:3 },
    { off1:'Zhana',                       on1:'Gemima',                    atMin:'20', count:1 },
    { off3:['Eloise S','Charli','Holly'], on3:['Ella','Arrabella','Zhana'],atMin:'30', count:3,
      htMid:true, gkSwap:'Ella S → GK  ·  Neve → CM (Holly shifts to ST)' },
    { off2:['Lacey','Isla'],              on2:['Charli','Eloise S'],       atMin:'40', count:2 },
    null,
  ],
  minutes:[
    { n:'Neve',     m:50, cat:'gk',  note:'GK all H1 · CM all H2 (preferred)' },
    { n:'Ella S',   m:50, cat:'gk',  note:'Outfield ST all H1 · GK all H2' },
    { n:'Charli',   m:40, cat:'v30', note:'S1 S2 S3 S5' },
    { n:'Gemima',   m:40, cat:'v30', note:'S1 S3 S4 S5' },
    { n:'Georgie',  m:40, cat:'v30', note:'S2 S3 S4 S5' },
    { n:'Lacey',    m:40, cat:'v30', note:'S1 S2 S3 S4' },
    { n:'Zhana',    m:40, cat:'v30', note:'S1 S2 S4 S5' },
    { n:'Arrabella',m:30, cat:'v29', note:'S1 S4 S5 · forward every seg' },
    { n:'Ella',     m:30, cat:'v29', note:'S1 S4 S5' },
    { n:'Eloise S', m:30, cat:'v29', note:'S2 S3 S5 · LB cover' },
    { n:'Holly',    m:30, cat:'v29', note:'S1 S2 S3 · CM' },
    { n:'Isla',     m:30, cat:'v29', note:'S2 S3 S4' },
  ],
  note:'<strong>40 min:</strong> Charli, Gemima, Georgie, Lacey, Zhana.<br><br><strong>30 min:</strong> Arrabella, Ella, Eloise S, Holly, Isla.<br><br><strong>GKs Neve + Ella S:</strong> 50 min — Neve goal H1 then ST H2; Ella S ST H1 then goal H2.<br><br>10-min gap between groups is unavoidable with bench=3 and 10 regulars. Rotate which five get 40 min week to week.'
};

// ══ PLAN B — Isla OUT · 11 players · bench 2 ═════════════════════════════════
const PLAN_B = {
  label:'Isla OUT', sub:'11 players · bench 2', badge:'BENCH 2',
  field:[
    [{n:'Eloise S',p:'LB',c:'def'},{n:'Lacey',   p:'RB',c:'def'},{n:'Charli',p:'CM',c:'cm'},{n:'Arrabella',p:'LF',c:'fwd'},{n:'Gemima', p:'CF',c:'fwd'},{n:'Ella',  p:'RF',c:'fwd'},{n:'Zhana',   p:'ST',c:'st'},{n:'Ella S',  p:'ST',c:'st'}], // S1
    [{n:'Eloise S',p:'LB',c:'def'},{n:'Lacey',   p:'RB',c:'def'},{n:'Holly', p:'CM',c:'cm'},{n:'Arrabella',p:'LF',c:'fwd'},{n:'Georgie',p:'CF',c:'fwd'},{n:'Ella',  p:'RF',c:'fwd'},{n:'Charli',  p:'ST',c:'st'},{n:'Ella S',  p:'ST',c:'st'}], // S2  Gemima→Georgie · Zhana→Holly
    [{n:'Eloise S',p:'LB',c:'def'},{n:'Lacey',   p:'RB',c:'def'},{n:'Holly', p:'CM',c:'cm'},{n:'Arrabella',p:'LF',c:'fwd'},{n:'Georgie',p:'CF',c:'fwd'},{n:'Ella',  p:'RF',c:'fwd'},{n:'Gemima',  p:'ST',c:'st'},{n:'Ella S',  p:'ST',c:'st'}], // S3  Charli→Gemima · HT mid-seg
    [{n:'Eloise S',p:'LB',c:'def'},{n:'Charli',  p:'RB',c:'def'},{n:'Neve',  p:'CM',c:'cm'},{n:'Zhana',    p:'LF',c:'fwd'},{n:'Georgie',p:'CF',c:'fwd'},{n:'Ella',  p:'RF',c:'fwd'},{n:'Holly',   p:'ST',c:'st'},{n:'Gemima',  p:'ST',c:'st'}], // S4  Arrabella→Zhana · Lacey→Charli · GK swap · Neve to CM · Gemima up top
    [{n:'Holly',   p:'LB',c:'def'},{n:'Charli', p:'RB',c:'def'},{n:'Neve',  p:'CM',c:'cm'},{n:'Zhana',    p:'LF',c:'fwd'},{n:'Georgie',p:'CF',c:'fwd'},{n:'Lacey', p:'RF',c:'fwd'},{n:'Gemima',  p:'ST',c:'st'},{n:'Arrabella',p:'ST',c:'st'}], // S5  Ella→Lacey · Eloise S→Arrabella · both up top
  ],
  bench:[
    ['Georgie','Holly'],       // S1
    ['Gemima','Zhana'],        // S2
    ['Charli','Zhana'],        // S3
    ['Arrabella','Lacey'],     // S4
    ['Ella','Eloise S'],       // S5
  ],
  subs:[
    { off2:['Gemima','Zhana'],   on2:['Georgie','Holly'],      atMin:'10', count:2 },
    { off1:'Charli',             on1:'Gemima',                 atMin:'20', count:1 },
    { off2:['Arrabella','Lacey'],on2:['Charli','Zhana'],       atMin:'30', count:2,
      htMid:true, gkSwap:'Ella S → GK  ·  Neve → CM (Holly shifts to ST)' },
    { off2:['Ella','Eloise S'],  on2:['Arrabella','Lacey'],    atMin:'40', count:2 },
    null,
  ],
  minutes:[
    { n:'Neve',     m:50, cat:'gk',  note:'GK all H1 · CM all H2 (preferred)' },
    { n:'Ella S',   m:50, cat:'gk',  note:'Outfield ST all H1 · GK all H2' },
    { n:'Arrabella',m:40, cat:'v30', note:'S1 S2 S3 S5' },
    { n:'Charli',   m:40, cat:'v30', note:'S1 S2 S4 S5' },
    { n:'Ella',     m:40, cat:'v30', note:'S1 S2 S3 S4' },
    { n:'Eloise S', m:40, cat:'v30', note:'S1 S2 S3 S4' },
    { n:'Gemima',   m:40, cat:'v30', note:'S1 S3 S4 S5' },
    { n:'Georgie',  m:40, cat:'v30', note:'S2 S3 S4 S5' },
    { n:'Holly',    m:40, cat:'v30', note:'S2 S3 S4 S5' },
    { n:'Lacey',    m:40, cat:'v30', note:'S1 S2 S3 S5' },
    { n:'Zhana',    m:30, cat:'v29', note:'S1 S4 S5' },
  ],
  note:'<strong>Almost everyone gets 40 min.</strong> Only <strong>Zhana</strong> lands on 30 (one extra rest) — with just 2 on the bench there is no other split.<br><br><strong>GKs Neve + Ella S:</strong> 50 min each.<br><br>Give the short straw to a different player each week so 30-min weeks rotate fairly.<br><br>Only one sub at the 20-min window; the rest are pairs.'
};

// live references — reassigned by switchPlan()
let CURRENT = 'A';
let FIELD   = PLAN_A.field;
let BENCH   = PLAN_A.bench;
let SUBS    = PLAN_A.subs;
let MINUTES = PLAN_A.minutes;

// ─── STATE ───────────────────────────────────────────────────────────────────
let activeSeg = 0;
let activeTab = 'rotation';
const GK_H1_OUT = 'Ella S';
const GK_H2_OUT = 'Neve';

// ─── RENDER ──────────────────────────────────────────────────────────────────
function renderSegTabs() {
  document.getElementById('segStrip').innerHTML = SEGS.map((s,i) => {
    const div = s.htBefore
      ? `<div style="display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex-shrink:0;padding-bottom:4px;margin:0 2px;gap:2px;">
           <span style="font-size:9px;font-weight:800;letter-spacing:1px;color:#f59e0b;">HT</span>
           <div style="width:2px;height:22px;background:#f59e0b;border-radius:2px;opacity:0.5;"></div>
         </div>` : '';
    return div + `<button class="seg-btn ${i===activeSeg?'active':''}" onclick="setSeg(${i})">${s.key}</button>`;
  }).join('');
}

function renderRotation() {
  const s = SEGS[activeSeg];
  const field = FIELD[activeSeg];
  const bench = BENCH[activeSeg];
  const sub = SUBS[activeSeg];

  // GK outfield label
  const gkOutfield = s.half === 1 ? GK_H1_OUT : GK_H2_OUT;

  // Time bar
  let html = `<div class="time-bar">
    <div>
      <div class="time-seg">${s.key} <span style="color:#64748b;font-size:14px;font-weight:500">· ${s.time} min</span></div>
      <div class="time-meta">Half ${s.half} · ${s.dur} min · bench = 3</div>
    </div>
    <div class="sub-count-badge">
      <div class="sub-count-num">${activeSeg+1}</div>
      <div class="sub-count-label">of 5</div>
    </div>
  </div>`;

  // HT done pill on S6+
  if (s.htBefore) {
    html += `<div style="background:#1c1400;border:1px solid #78350f;border-radius:8px;padding:8px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:14px;">✅</span>
      <span style="font-size:12px;font-weight:700;color:#f59e0b;">Half time done — Isla in goal · Arrabella at ST</span>
    </div>`;
  }

  // GK
  html += `<div class="card">
    <div class="card-head"><span>Goalkeeper</span><span class="gk-pill">${s.gk} · ${s.gkNote}</span></div>
    <div class="player-list">
      <span class="p-tag gk-tag">${s.gk}</span>
      <span class="p-tag field" style="color:#94a3b8;font-size:12px;margin-left:4px;">
        ${gkOutfield} playing outfield ↗
      </span>
    </div>
  </div>`;

  // On field
  html += `<div class="card">
    <div class="card-head"><span>On Field — Outfield (8)</span></div>
    <div class="player-grid">
      ${field.map(p => `<div class="p-chip c-${p.c}">
        <div class="p-chip-pos">${p.p}</div>
        <div class="p-chip-name">${p.n}</div>
      </div>`).join('')}
    </div>
  </div>`;

  // Bench
  html += `<div class="card">
    <div class="card-head"><span>Bench (3)</span></div>
    <div class="player-list">
      ${bench.map(n => `<span class="p-tag bench">${n}</span>`).join('')}
    </div>
  </div>`;

  // Sub card
  // Build off/on arrays from whatever format is in SUBS
  function subPairs(sub) {
    if (!sub) return [];
    const pairs = [];
    if (sub.off1) pairs.push([sub.off1, sub.on1]);
    if (sub.off2) sub.off2.forEach((o,i) => pairs.push([o, sub.on2[i]]));
    if (sub.off3) sub.off3.forEach((o,i) => pairs.push([o, sub.on3[i]]));
    return pairs;
  }

  if (!sub) {
    html += `<div class="sub-card no-sub">
      <div class="sub-card-head"><span>No more subs — game ends at 50 min</span></div>
    </div>`;
  } else {
    const pairs = subPairs(sub);
    const cardClass = sub.htMid ? 'sub-card ht' : 'sub-card';
    const headClass = sub.htMid ? 'sub-card-head ht' : 'sub-card-head';
    html += `<div class="${cardClass}">`;
    // Half-time GK swap happens FIRST, mid-segment at 25 min — keepers only
    if (sub.htMid) {
      html += `<div class="sub-card-head ht">
        <span>🥅 HALF TIME — GK swap only</span>
        <span class="sub-time ht">25 min</span>
      </div>
      <div style="padding:6px 14px 2px;font-size:11px;color:#f59e0b;font-weight:600;">
        At 25 min: swap keepers. No outfield players change here.</div>
      <div class="gk-swap-row">${sub.gkSwap}</div>`;
    }
    // Outfield player subs happen at the END of the segment (30 min)
    html += `<div class="${headClass}" style="${sub.htMid?'margin-top:10px;':''}">
        <span>${sub.count+' player sub'+(sub.count>1?'s':'')+' at end of '+s.key}</span>
        <span class="sub-time">${sub.atMin} min</span>
      </div>`;
    pairs.forEach(([off,on]) => {
      html += `<div class="sub-row">
        <div class="sub-off">← ${off}</div>
        <div class="sub-arrow">→</div>
        <div class="sub-on">→ ${on}</div>
      </div>`;
    });
    html += `</div>`;
  }

  // Next up nav
  if (activeSeg < SEGS.length - 1) {
    const next = SEGS[activeSeg+1];
    html += `<button onclick="setSeg(${activeSeg+1})" style="
      width:100%;padding:13px;background:#1e293b;border:none;
      border-radius:10px;color:#64748b;font-family:'DM Sans',sans-serif;
      font-size:14px;font-weight:600;cursor:pointer;text-align:center;
    ">Next: ${next.key} (${next.time} min) →</button>`;
  }

  return html;
}

// pitch view state: which segment to show on the field
let pitchSeg = 0;
// coordinates per position slot: {x%, y%} on a vertical pitch (GK bottom, attack top)
const PITCH_XY = {
  LB:{x:25,y:72}, RB:{x:75,y:72}, CM:{x:50,y:55},
  LF:{x:22,y:36}, CF:{x:50,y:34}, RF:{x:78,y:36},
  ST:{x:33,y:14}, ST2:{x:67,y:14}
};

function renderPitch() {
  const s = SEGS[pitchSeg];
  const field = FIELD[pitchSeg];
  const bench = BENCH[pitchSeg];
  const gkOutfield = s.half === 1 ? GK_H1_OUT : GK_H2_OUT;

  // two ST chips -> assign ST / ST2 slots in order
  let stCount = 0;
  let bubbles = field.map(f => {
    let slot = f.p;
    if (f.p === 'ST') { slot = stCount === 0 ? 'ST' : 'ST2'; stCount++; }
    const xy = PITCH_XY[slot] || {x:50,y:50};
    const isGkOut = f.n === gkOutfield;
    return `<div class="pp" style="left:${xy.x}%;top:${xy.y}%;">
      <span class="pp-pos">${f.p}</span>
      <div class="pp-bubble ${isGkOut?'gkout':''}">${f.n}</div>
    </div>`;
  }).join('');

  // GK in goal at the bottom
  bubbles += `<div class="pp" style="left:50%;top:90%;">
    <span class="pp-pos">GK</span>
    <div class="pp-bubble gk">${s.gk}</div>
  </div>`;

  const benchChips = bench.map(n =>
    `<div class="pb-chip"><div class="pb-bubble">${n}</div></div>`).join('');

  let h = `<div class="pitch-wrap">`;
  // half / segment toggle
  h += `<div class="pitch-toggle">`;
  SEGS.forEach((sg,i) => {
    h += `<button class="pt-btn ${i===pitchSeg?'active':''}" onclick="setPitchSeg(${i})">${sg.key}<br><span style="font-size:9px;opacity:0.8;">${sg.time}</span></button>`;
  });
  h += `</div>`;

  h += `<div class="pitch">
    <div class="pitch-line pl-half"></div>
    <div class="pitch-line pl-circle"></div>
    <div class="pitch-line pl-box-top"></div>
    <div class="pitch-line pl-box-bot"></div>
    ${bubbles}
  </div>`;

  h += `<div class="pitch-cap">Half ${s.half} · ${s.time} min · ⚡ gold ring = keeper playing outfield (${gkOutfield})</div>`;

  h += `<div class="pitch-bench">
    <div class="pitch-bench-lbl">On the bench (${bench.length})</div>
    <div class="pb-row">${benchChips}</div>
  </div>`;

  h += `</div>`;
  return h;
}

function setPitchSeg(i) { pitchSeg = i; render(); }

function renderSubs() {
  let html = `<div class="subs-wrap">`;
  const _P = CURRENT === 'A' ? PLAN_A : PLAN_B;
  html += `<div class="subs-intro">
    <strong>${_P.label} — ${_P.sub}.</strong> Subs at 10, 20, 30 and 40 min.
    Half time GK swap mid-segment at 25 min.
    ${CURRENT==='A' ? 'Five players get 40 min, five get 30 min.' : 'Everyone gets 40 min except one player at 30.'}
    GKs <strong>Neve + Ella S</strong> play 50 min.
  </div>`;

  function subPairsAll(sub) {
    if (!sub) return [];
    const p = [];
    if (sub.off1) p.push([sub.off1, sub.on1]);
    if (sub.off2) sub.off2.forEach((o,i) => p.push([o, sub.on2[i]]));
    if (sub.off3) sub.off3.forEach((o,i) => p.push([o, sub.on3[i]]));
    return p;
  }

  SUBS.forEach((sub, i) => {
    if (!sub) return;
    const pairs = subPairsAll(sub);
    // For the half-time segment, show the GK swap as its own 25-min event first
    if (sub.htMid) {
      html += `<div class="sub-event">
        <div class="ev-time-col">
          <div class="ev-time-num">25</div>
          <div class="ev-time-unit">HT · MIN</div>
        </div>
        <div class="ev-body">
          <div class="ev-label">🥅 GK swap only — no player change</div>
          <div class="ev-note">${sub.gkSwap}</div>
        </div>
      </div>`;
    }
    html += `<div class="sub-event">
      <div class="ev-time-col">
        <div class="ev-time-num">${sub.atMin}</div>
        <div class="ev-time-unit">MIN</div>
      </div>
      <div class="ev-body">
        <div class="ev-label">${sub.count} player sub${sub.count>1?'s':''}</div>`;
    pairs.forEach(([off,on]) => {
      html += `<div class="ev-pair">
          <span class="ev-off">← ${off}</span>
          <span class="ev-arr"> → </span>
          <span class="ev-on">${on}</span>
        </div>`;
    });
    html += `</div></div>`;
  });

  html += `</div>`;
  return html;
}

function renderMinutes() {
  let html = `<div class="card" style="border-radius:12px;">`;
  MINUTES.forEach(p => {
    const pct = (p.m / 50) * 100;
    const bc = p.cat==='gk' ? 'bar-gk' : p.cat==='v30' ? 'bar-30' : 'bar-29';
    const vc = p.cat==='gk' ? 'gk' : p.cat==='v30' ? 'v30' : 'v29';
    html += `<div class="min-row">
      <div class="min-name">${p.n}</div>
      <div style="flex:1;">
        <div class="min-bar-wrap"><div class="min-bar ${bc}" style="width:${pct}%"></div></div>
        <div style="font-size:10px;color:#475569;margin-top:2px;">${p.note}</div>
      </div>
      <div class="min-val ${vc}">${p.m}'</div>
    </div>`;
  });
  html += `</div>`;

  const P = CURRENT === 'A' ? PLAN_A : PLAN_B;
  html += `<div class="mins-note">${P.note}</div>`;
  return html;
}

function switchPlan(key) {
  CURRENT = key;
  const P = key === 'A' ? PLAN_A : PLAN_B;
  FIELD = P.field; BENCH = P.bench; SUBS = P.subs; MINUTES = P.minutes;
  if (activeSeg > SEGS.length - 1) activeSeg = 0;
  document.getElementById('psA').classList.toggle('active', key==='A');
  document.getElementById('psB').classList.toggle('active', key==='B');
  document.getElementById('hdrSub').textContent = '9 on field · 2×25 min · ' + P.sub;
  document.getElementById('hdrBadge').textContent = P.badge;
  render();
}

// ─── MAIN ────────────────────────────────────────────────────────────────────
function render() {
  renderSegTabs();
  const strip = document.getElementById('segStrip');
  strip.classList.toggle('hidden', activeTab !== 'rotation');

  const mc = document.getElementById('mainContent');
  if (activeTab === 'rotation') mc.innerHTML = renderRotation();
  else if (activeTab === 'pitch') mc.innerHTML = renderPitch();
  else if (activeTab === 'subs') mc.innerHTML = renderSubs();
  else mc.innerHTML = renderMinutes();
}

function setSeg(i) {
  activeSeg = i; render();
  const btns = document.querySelectorAll('.seg-btn');
  if (btns[i]) btns[i].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function setTab(t) {
  activeTab = t;
  ['Rotation','Pitch','Subs','Mins'].forEach(x => {
    const key = x==='Mins'?'minutes':x.toLowerCase();
    const el = document.getElementById('nav'+x);
    const bel = document.getElementById('bnav'+x);
    if(el) el.classList.toggle('active', key===t);
    if(bel) bel.classList.toggle('active', key===t);
  });
  render();
}

render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hurricanes – Match Day</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f172a;
    color: #f1f5f9;
    max-width: 480px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* HEADER */
  .hdr {
    background: linear-gradient(135deg, #166534 0%, #15803d 60%, #16a34a 100%);
    padding: 20px 20px 16px;
    border-bottom: 3px solid #4ade80;
    flex-shrink: 0;
  }
  .hdr-eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 3px; opacity: 0.8; margin-bottom: 4px; }
  .hdr-title { font-size: 22px; font-weight: 700; }
  .hdr-sub { font-size: 13px; opacity: 0.85; margin-top: 4px; }

  /* SEG TABS */
  .seg-strip {
    display: flex; gap: 8px; padding: 12px 12px 0;
    background: #0f172a; border-bottom: 1px solid #1e293b;
    overflow-x: auto; scrollbar-width: none; flex-shrink: 0;
  }
  .seg-strip.hidden { display: none; }
  .seg-strip::-webkit-scrollbar { display: none; }
  .seg-btn {
    flex-shrink: 0; padding: 10px 14px;
    border-radius: 10px 10px 0 0;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700;
    border: none; cursor: pointer;
    background: #1e293b; color: #64748b;
    transition: all 0.15s;
  }
  .seg-btn.active { background: #052e16; color: #4ade80; border-bottom: 2px solid #4ade80; }
  .seg-btn.ht { color: #f59e0b; }
  .seg-btn.ht.active { background: #1c1400; color: #fbbf24; border-bottom-color: #fbbf24; }

  /* NAV TABS */
  .nav-tabs {
    display: flex; background: #0f172a;
    border-bottom: 1px solid #1e293b; flex-shrink: 0;
  }
  .nav-btn {
    flex: 1; padding: 12px 8px;
    border: none; background: none;
    font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 13px;
    letter-spacing: 1px; text-transform: uppercase;
    color: #64748b; cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 0.2s;
  }
  .nav-btn.active { color: #4ade80; border-bottom-color: #4ade80; }

  /* CONTENT */
  .content { flex: 1; overflow-y: auto; padding: 16px 16px 90px; }

  /* CARDS */
  .card {
    background: #1e293b; border-radius: 12px;
    margin-bottom: 12px; overflow: hidden;
  }
  .card-head {
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: #64748b; text-transform: uppercase;
    padding: 10px 14px; background: #1e293b;
    border-bottom: 1px solid #0f172a;
    display: flex; align-items: center; justify-content: space-between;
  }
  .gk-pill {
    background: #78350f; color: #fbbf24;
    padding: 3px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 700;
  }

  /* TIME BAR */
  .time-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 14px;
    background: #1e293b; border-radius: 12px;
    margin-bottom: 12px;
  }
  .time-clock {
    font-family: 'DM Mono', monospace; font-size: 24px; font-weight: 500;
    color: #4ade80;
  }
  .time-meta { font-size: 13px; color: #64748b; }
  .time-seg { font-size: 18px; font-weight: 700; color: #f1f5f9; }

  /* PLAYER GRID */
  .player-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; padding: 12px;
  }
  .p-chip {
    background: #0f172a; border-radius: 8px; padding: 8px 4px;
    text-align: center; border-top: 3px solid transparent;
  }
  .p-pos {
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 4px;
  }
  .p-name { font-size: 11px; font-weight: 600; line-height: 1.2; }

  .cat-gk  { border-top-color: #f59e0b; }  .cat-gk  .p-pos { color: #f59e0b; }
  .cat-def { border-top-color: #34d399; }  .cat-def .p-pos { color: #34d399; }
  .cat-cm  { border-top-color: #818cf8; }  .cat-cm  .p-pos { color: #818cf8; }
  .cat-fwd { border-top-color: #fb923c; }  .cat-fwd .p-pos { color: #fb923c; }
  .cat-st  { border-top-color: #f87171; }  .cat-st  .p-pos { color: #f87171; }

  /* GK CHIP (wide) */
  .gk-chip {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; margin: 12px;
    background: #0f172a; border-radius: 8px;
    border-top: 3px solid #f59e0b;
  }
  .gk-chip .p-pos { color: #f59e0b; font-size: 11px; font-weight: 700; min-width: 24px; }
  .gk-chip .p-name { font-size: 15px; font-weight: 700; color: #fbbf24; }
  .gk-chip .gk-note { margin-left: auto; font-size: 11px; color: #64748b; }

  /* BENCH */
  .bench-row { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; }
  .b-chip {
    padding: 6px 14px; border-radius: 8px;
    background: #0f172a; font-size: 13px; font-weight: 600; color: #94a3b8;
    border: 1px solid #1e293b;
  }

  /* SUB ALERT */
  .sub-alert {
    background: #1e293b; border-radius: 12px; margin-bottom: 12px; overflow: hidden;
    border: 1px solid #334155;
  }
  .sub-alert.ht { border-color: #6366f1; background: #1e1b4b; }
  .sub-head {
    padding: 10px 14px; font-size: 11px; font-weight: 600;
    letter-spacing: 1px; color: #64748b; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sub-head.ht { color: #a5b4fc; }
  .sub-time {
    font-family: 'DM Mono', monospace; background: #0f172a;
    color: #4ade80; padding: 3px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 500;
  }
  .sub-time.ht { color: #fbbf24; background: #1c1400; }
  .sub-body { display: flex; }
  .sub-col { flex: 1; padding: 10px 12px; }
  .sub-col:first-child { border-right: 1px solid #0f172a; }
  .sub-col-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 7px; }
  .label-off { color: #f87171; }
  .label-on  { color: #4ade80; }
  .sub-name {
    padding: 6px 10px; border-radius: 6px;
    font-size: 13px; font-weight: 600; margin-bottom: 4px;
  }
  .off-name { background: #450a0a; border-left: 3px solid #f87171; color: #fca5a5; }
  .on-name  { background: #052e16; border-left: 3px solid #4ade80; color: #86efac; }

  /* HT PANEL */
  .ht-panel { padding: 16px; }
  .ht-big { font-size: 28px; font-weight: 700; color: #fbbf24; margin-bottom: 4px; }
  .ht-note { font-size: 13px; color: #64748b; margin-bottom: 14px; }
  .gk-swap {
    background: #1c1400; border: 1px solid #6d4a00;
    border-radius: 8px; padding: 10px 14px;
    font-size: 14px; font-weight: 600; color: #fbbf24;
    margin-bottom: 12px; display: flex; align-items: center; gap: 8px;
  }
  .ht-count {
    font-size: 11px; font-weight: 600; letter-spacing: 1px;
    color: #64748b; text-transform: uppercase; margin-bottom: 8px;
  }

  /* OPTIONAL LATE SUB */
  .late-box {
    background: #1e293b; border: 1px dashed #3b82f6; border-radius: 12px;
    margin-bottom: 12px; overflow: hidden;
  }
  .late-head {
    padding: 10px 14px; font-size: 11px; font-weight: 600;
    letter-spacing: 1px; color: #60a5fa; text-transform: uppercase;
    display: flex; align-items: center; justify-content: space-between;
  }
  .late-toggle {
    background: #1d4ed8; border: none; color: #fff;
    padding: 4px 12px; border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600;
    cursor: pointer;
  }
  .late-toggle.on { background: #166534; color: #4ade80; }
  .late-body { padding: 10px 14px; font-size: 13px; color: #94a3b8; line-height: 1.6; }
  .late-body strong { color: #60a5fa; }

  /* ALL SUBS TAB */
  .subs-wrap { padding: 4px 0; }
  .sub-event { display: flex; gap: 12px; padding: 0 0 16px; }
  .ev-time { flex-shrink: 0; width: 52px; text-align: center; }
  .ev-num {
    font-family: 'DM Mono', monospace; font-size: 24px; font-weight: 500;
    color: #4ade80; line-height: 1;
  }
  .ev-unit { font-size: 10px; color: #64748b; letter-spacing: 1px; }
  .ev-body { flex: 1; }
  .ev-label { font-size: 11px; font-weight: 600; letter-spacing: 1px; color: #64748b; text-transform: uppercase; margin-bottom: 7px; }
  .ev-pair { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; font-size: 14px; font-weight: 600; }
  .ev-off { color: #fca5a5; }
  .ev-arrow { color: #334155; }
  .ev-on  { color: #86efac; }
  .ht-divider {
    background: #1c1400; border: 1px solid #6d4a00; border-radius: 10px;
    padding: 12px 14px; margin-bottom: 16px; text-align: center;
    font-size: 14px; font-weight: 700; color: #fbbf24; letter-spacing: 1px;
  }
  .opt-badge {
    margin-top: 6px; font-size: 12px; color: #60a5fa;
    background: #0f172a; border: 1px dashed #3b82f6;
    border-radius: 6px; padding: 4px 10px; display: inline-block;
  }

  /* MINUTES TAB */
  .min-row {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 14px; border-bottom: 1px solid #0f172a;
  }
  .min-name { width: 78px; font-size: 14px; font-weight: 600; flex-shrink: 0; }
  .min-bar-wrap {
    flex: 1; height: 8px; background: #0f172a; border-radius: 4px; overflow: hidden;
  }
  .min-bar { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .bar-gk    { background: #f59e0b; }
  .bar-full  { background: #4ade80; }
  .bar-short { background: #fb923c; }
  .min-val {
    width: 40px; text-align: right;
    font-family: 'DM Mono', monospace; font-size: 15px; font-weight: 500;
    flex-shrink: 0;
  }
  .min-val.gk    { color: #f59e0b; }
  .min-val.full  { color: #4ade80; }
  .min-val.short { color: #fb923c; }
  .mins-note {
    margin: 12px; padding: 12px 14px;
    background: #1e293b; border-radius: 10px;
    font-size: 12px; color: #94a3b8; line-height: 1.6;
  }
  .mins-note strong { color: #f1f5f9; }

  /* BOTTOM NAV (fixed) */
  .bottom-nav {
    position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
    width: 100%; max-width: 480px;
    background: #0f172a; border-top: 1px solid #1e293b;
    display: flex; z-index: 100;
  }
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-eyebrow">HURRICANES · MATCH DAY</div>
  <div class="hdr-title">Rotation Planner</div>
  <div class="hdr-sub">14 players · 9 on field · 50 min · Bench 5</div>
</div>

<div class="nav-tabs">
  <button class="nav-btn active" id="navRotation" onclick="setTab('rotation')">⚽ Rotation</button>
  <button class="nav-btn" id="navSubs" onclick="setTab('subs')">🔄 All Subs</button>
  <button class="nav-btn" id="navMins" onclick="setTab('minutes')">⏱ Minutes</button>
</div>

<div class="seg-strip" id="segStrip"></div>

<div class="content" id="mainContent"></div>

<div class="bottom-nav">
  <button class="nav-btn active" id="bnavRotation" onclick="setTab('rotation')">⚽ Rotation</button>
  <button class="nav-btn" id="bnavSubs" onclick="setTab('subs')">🔄 All Subs</button>
  <button class="nav-btn" id="bnavMins" onclick="setTab('minutes')">⏱ Minutes</button>
</div>

<script>
const SEGS = [
  {
    key:'S1', label:'S1', time:'0 – 8 min', half:1, dur:8,
    gk:'Holly', gkNote:'GK · H1',
    field:[
      {n:'Georgie',  pos:'LB', cat:'def'},
      {n:'Ella',     pos:'RB', cat:'def'},
      {n:'Zhana',    pos:'CM', cat:'cm'},
      {n:'Ella S',   pos:'LF', cat:'fwd'},
      {n:'Charli',   pos:'CF', cat:'fwd'},
      {n:'Eloise P', pos:'RF', cat:'fwd'},
      {n:'Arrabella',pos:'ST', cat:'st'},
      {n:'Gemima',   pos:'ST', cat:'st'},
    ],
    bench:['Neve','Eloise S','Harper','Isla','Lacey'],
    sub:{ time:'8 min', off:['Georgie','Ella'], on:['Neve','Eloise S'] },
  },
  {
    key:'S2', label:'S2', time:'8 – 17 min', half:1, dur:9,
    gk:'Holly', gkNote:'GK · H1',
    field:[
      {n:'Eloise S', pos:'LB', cat:'def'},
      {n:'Zhana',    pos:'RB', cat:'def'},
      {n:'Neve',     pos:'CM', cat:'cm'},
      {n:'Ella S',   pos:'LF', cat:'fwd'},
      {n:'Charli',   pos:'CF', cat:'fwd'},
      {n:'Eloise P', pos:'RF', cat:'fwd'},
      {n:'Arrabella',pos:'ST', cat:'st'},
      {n:'Gemima',   pos:'ST', cat:'st'},
    ],
    bench:['Georgie','Ella','Harper','Isla','Lacey'],
    sub:{ time:'17 min', off:['Arrabella','Gemima'], on:['Georgie','Ella'] },
  },
  {
    key:'S3', label:'S3', time:'17 – 25 min', half:1, dur:8,
    gk:'Holly', gkNote:'GK · H1',
    field:[
      {n:'Eloise S', pos:'LB', cat:'def'},
      {n:'Georgie',  pos:'RB', cat:'def'},
      {n:'Neve',     pos:'CM', cat:'cm'},
      {n:'Ella',     pos:'LF', cat:'fwd'},
      {n:'Charli',   pos:'CF', cat:'fwd'},
      {n:'Zhana',    pos:'RF', cat:'fwd'},
      {n:'Ella S',   pos:'ST', cat:'st'},
      {n:'Eloise P', pos:'ST', cat:'st'},
    ],
    bench:['Arrabella','Gemima','Harper','Isla','Lacey'],
    sub:null, isHT:true,
  },
  {
    key:'HT', label:'HT', isBreak:true,
    htOff:['Charli','Ella S','Zhana','Neve','Georgie'],
    htOn:['Harper','Isla','Lacey','Arrabella','Gemima'],
    gkSwap:'Holly → Outfield  ·  Eloise P → GK',
  },
  {
    key:'S4', label:'S4', time:'25 – 33 min', half:2, dur:8,
    gk:'Eloise P', gkNote:'GK · H2',
    field:[
      {n:'Eloise S', pos:'LB', cat:'def'},
      {n:'Holly',    pos:'RB', cat:'def'},
      {n:'Ella',     pos:'CM', cat:'cm'},
      {n:'Isla',     pos:'LF', cat:'fwd'},
      {n:'Lacey',    pos:'CF', cat:'fwd'},
      {n:'Harper',   pos:'RF', cat:'fwd'},
      {n:'Arrabella',pos:'ST', cat:'st'},
      {n:'Gemima',   pos:'ST', cat:'st'},
    ],
    bench:['Neve','Georgie','Charli','Ella S','Zhana'],
    sub:{ time:'33 min', off:['Eloise S','Ella'], on:['Neve','Georgie'] },
  },
  {
    key:'S5', label:'S5', time:'33 – 42 min', half:2, dur:9,
    gk:'Eloise P', gkNote:'GK · H2',
    field:[
      {n:'Georgie',  pos:'LB', cat:'def'},
      {n:'Holly',    pos:'RB', cat:'def'},
      {n:'Neve',     pos:'CM', cat:'cm'},
      {n:'Isla',     pos:'LF', cat:'fwd'},
      {n:'Lacey',    pos:'CF', cat:'fwd'},
      {n:'Harper',   pos:'RF', cat:'fwd'},
      {n:'Arrabella',pos:'ST', cat:'st'},
      {n:'Gemima',   pos:'ST', cat:'st'},
    ],
    bench:['Eloise S','Ella','Charli','Ella S','Zhana'],
    sub:{ time:'42 min', off:['Arrabella','Gemima'], on:['Eloise S','Ella'] },
    lateSub:{
      extraOff:'Neve', extraOn:'Charli',
      detail:'Add a <strong>3rd sub at 42 min</strong>: swap Neve → Charli.<br>Charli finishes at <strong>33 min</strong>. Neve finishes at <strong>26 min</strong>.<br>Good if Neve has had a strong run and Charli deserves H2 time.',
    },
  },
  {
    key:'S6', label:'S6', time:'42 – 50 min', half:2, dur:8,
    gk:'Eloise P', gkNote:'GK · H2',
    field:[
      {n:'Georgie',  pos:'LB', cat:'def'},
      {n:'Eloise S', pos:'RB', cat:'def'},
      {n:'Neve',     pos:'CM', cat:'cm'},
      {n:'Ella',     pos:'LF', cat:'fwd'},
      {n:'Holly',    pos:'CF', cat:'fwd'},
      {n:'Harper',   pos:'RF', cat:'fwd'},
      {n:'Isla',     pos:'ST', cat:'st'},
      {n:'Lacey',    pos:'ST', cat:'st'},
    ],
    fieldAlt:[
      {n:'Georgie',  pos:'LB', cat:'def'},
      {n:'Eloise S', pos:'RB', cat:'def'},
      {n:'Charli',   pos:'CM', cat:'cm'},
      {n:'Ella',     pos:'LF', cat:'fwd'},
      {n:'Holly',    pos:'CF', cat:'fwd'},
      {n:'Harper',   pos:'RF', cat:'fwd'},
      {n:'Isla',     pos:'ST', cat:'st'},
      {n:'Lacey',    pos:'ST', cat:'st'},
    ],
    bench:['Arrabella','Gemima','Charli','Ella S','Zhana'],
    benchAlt:['Arrabella','Gemima','Neve','Ella S','Zhana'],
    sub:null,
  },
];

const MINUTES = [
  {n:'Holly',    mins:50, cat:'gk',    note:'GK all H1 · Outfield all H2'},
  {n:'Eloise P', mins:50, cat:'gk',    note:'Outfield all H1 · GK all H2'},
  {n:'Arrabella',mins:34, cat:'full',  note:'S1 S2 S4 S5'},
  {n:'Gemima',   mins:34, cat:'full',  note:'S1 S2 S4 S5'},
  {n:'Neve',     mins:34, cat:'full',  note:'S2 S3 S5 S6'},
  {n:'Eloise S', mins:33, cat:'full',  note:'S2 S3 S4 S6'},
  {n:'Georgie',  mins:33, cat:'full',  note:'S1 S3 S5 S6'},
  {n:'Ella',     mins:32, cat:'full',  note:'S1 S3 S4 S6'},
  {n:'Charli',   mins:25, cat:'short', note:'H1 only · S1 S2 S3'},
  {n:'Ella S',   mins:25, cat:'short', note:'H1 only · S1 S2 S3'},
  {n:'Zhana',    mins:25, cat:'short', note:'H1 only · S1 S2 S3'},
  {n:'Harper',   mins:25, cat:'short', note:'H2 only · S4 S5 S6'},
  {n:'Isla',     mins:25, cat:'short', note:'H2 only · S4 S5 S6'},
  {n:'Lacey',    mins:25, cat:'short', note:'H2 only · S4 S5 S6'},
];

let activeSeg = 0;
let activeTab = 'rotation';
let lateSubOn = false;

// ── RENDER ─────────────────────────────────────

function renderSegTabs() {
  document.getElementById('segStrip').innerHTML = SEGS.map((s,i) => {
    const cls = ['seg-btn', i===activeSeg?'active':'', s.isBreak?'ht':''].join(' ').trim();
    return `<button class="${cls}" onclick="setSeg(${i})">${s.label}</button>`;
  }).join('');
}

function renderRotation() {
  const seg = SEGS[activeSeg];
  let html = '';

  // Time bar (non-HT)
  if (!seg.isBreak) {
    html += `<div class="time-bar">
      <div>
        <div class="time-seg">${seg.label}</div>
        <div class="time-meta">Half ${seg.half} · ${seg.dur} min</div>
      </div>
      <div class="time-clock">${seg.time}</div>
      <div class="gk-pill">${seg.gk}</div>
    </div>`;
  }

  if (seg.isBreak) {
    html += `<div class="card">
      <div class="ht-panel">
        <div class="ht-big">⚡ HALF TIME</div>
        <div class="ht-note">GK swap + 5 outfield changes now</div>
        <div class="gk-swap">🥅 ${seg.gkSwap}</div>
        <div class="ht-count">5 OUTFIELD SUBS</div>
        <div class="sub-body" style="border:1px solid #1e293b;border-radius:8px;overflow:hidden;margin-top:8px;">
          <div class="sub-col">
            <div class="sub-col-label label-off">OFF</div>
            ${seg.htOff.map(p=>`<div class="sub-name off-name">← ${p}</div>`).join('')}
          </div>
          <div class="sub-col">
            <div class="sub-col-label label-on">ON</div>
            ${seg.htOn.map(p=>`<div class="sub-name on-name">→ ${p}</div>`).join('')}
          </div>
        </div>
      </div>
    </div>`;
    return html;
  }

  // GK
  html += `<div class="card">
    <div class="card-head"><span>Goalkeeper</span></div>
    <div class="gk-chip">
      <span class="p-pos" style="color:#f59e0b;">GK</span>
      <span class="p-name" style="font-size:16px;font-weight:700;color:#fbbf24;">${seg.gk}</span>
      <span class="gk-note">${seg.gkNote}</span>
    </div>
  </div>`;

  // Outfield
  const useAlt = seg.key==='S6' && lateSubOn;
  const fieldData = useAlt ? seg.fieldAlt : seg.field;
  html += `<div class="card">
    <div class="card-head"><span>On Field — Outfield (8)</span></div>
    <div class="player-grid">
      ${fieldData.map(p=>`
        <div class="p-chip cat-${p.cat}">
          <div class="p-pos">${p.pos}</div>
          <div class="p-name">${p.n}</div>
        </div>`).join('')}
    </div>
  </div>`;

  // Bench
  const benchData = useAlt ? seg.benchAlt : seg.bench;
  html += `<div class="card">
    <div class="card-head"><span>Bench (5)</span></div>
    <div class="bench-row">
      ${benchData.map(p=>`<div class="b-chip">${p}</div>`).join('')}
    </div>
  </div>`;

  // Sub alert
  if (seg.sub) {
    html += `<div class="sub-alert">
      <div class="sub-head">
        <span>Next sub window</span>
        <span class="sub-time">${seg.sub.time}</span>
      </div>
      <div class="sub-body">
        <div class="sub-col">
          <div class="sub-col-label label-off">OFF</div>
          ${seg.sub.off.map(p=>`<div class="sub-name off-name">← ${p}</div>`).join('')}
        </div>
        <div class="sub-col">
          <div class="sub-col-label label-on">ON</div>
          ${seg.sub.on.map(p=>`<div class="sub-name on-name">→ ${p}</div>`).join('')}
        </div>
      </div>
    </div>`;
  } else if (seg.isHT) {
    html += `<div class="sub-alert ht">
      <div class="sub-head ht">
        <span>Half Time — see HT tab for full list</span>
        <span class="sub-time ht">25 min</span>
      </div>
    </div>`;
  } else {
    html += `<div class="sub-alert" style="opacity:0.5;">
      <div class="sub-head"><span>No further subs — game ends at 50 min</span></div>
    </div>`;
  }

  // Optional late sub
  if (seg.lateSub) {
    html += `<div class="late-box">
      <div class="late-head">
        <span>Optional 3rd Sub</span>
        <button class="late-toggle ${lateSubOn?'on':''}" onclick="toggleLate()">${lateSubOn?'✓ Applied':'Apply'}</button>
      </div>
      <div class="late-body">${seg.lateSub.detail}</div>
    </div>`;
  }

  return html;
}

function renderSubs() {
  const events = [
    { time:'8',  label:'2 Subs', pairs:[['Georgie','Neve'],['Ella','Eloise S']] },
    { time:'17', label:'2 Subs', pairs:[['Arrabella','Georgie'],['Gemima','Ella']] },
    { isHT:true },
    { time:'33', label:'2 Subs', pairs:[['Eloise S','Neve'],['Ella','Georgie']] },
    { time:'42', label:'2 Subs (+ Optional 3rd)', pairs:[['Arrabella','Eloise S'],['Gemima','Ella']], opt:true },
  ];

  let html = '<div style="padding:16px 16px 0;">';
  events.forEach(ev => {
    if (ev.isHT) {
      html += `<div class="ht-divider">🥅 HALF TIME · 25 min · GK Swap + 5 Subs<br>
        <span style="font-size:12px;color:#f59e0b;font-weight:400;">
        Charli · Ella S · Zhana · Neve · Georgie  →  Harper · Isla · Lacey · Arrabella · Gemima<br>
        Holly → Outfield &nbsp;·&nbsp; Eloise P → GK
        </span>
      </div>`;
      return;
    }
    html += `<div class="sub-event">
      <div class="ev-time">
        <div class="ev-num">${ev.time}</div>
        <div class="ev-unit">MIN</div>
      </div>
      <div class="ev-body">
        <div class="ev-label">${ev.label}</div>
        ${ev.pairs.map(([off,on])=>`
          <div class="ev-pair">
            <span class="ev-off">← ${off}</span>
            <span class="ev-arrow">→</span>
            <span class="ev-on">${on}</span>
          </div>`).join('')}
        ${ev.opt ? `<div class="opt-badge">Optional: Neve → Charli (3rd sub)</div>` : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function renderMinutes() {
  let html = `<div class="card" style="margin-bottom:0;border-radius:12px 12px 0 0;">`;
  MINUTES.forEach(p => {
    const pct = (p.mins / 50) * 100;
    const bc = p.cat==='gk' ? 'bar-gk' : p.cat==='full' ? 'bar-full' : 'bar-short';
    const vc = p.cat==='gk' ? 'gk' : p.cat==='full' ? 'full' : 'short';
    html += `<div class="min-row">
      <div class="min-name">${p.n}</div>
      <div>
        <div class="min-bar-wrap"><div class="min-bar ${bc}" style="width:${pct}%"></div></div>
        <div style="font-size:10px;color:#475569;margin-top:2px;">${p.note}</div>
      </div>
      <div class="min-val ${vc}">${p.mins}'</div>
    </div>`;
  });
  html += '</div>';
  html += `<div class="mins-note">
    <strong>GKs (Holly + Eloise P):</strong> 50 min each — they earn it by volunteering for goal. Outfield the other half.<br><br>
    <strong>6 cross-half players</strong> (Neve, Eloise S, Georgie, Ella, Arrabella, Gemima): 32–34 min — rotate across both halves with only 2 subs at a time.<br><br>
    <strong>6 half-only players</strong>: 25 min each — H1 group plays first half, H2 group plays second half. Rotate who fills these slots each game so season minutes stay fair.<br><br>
    <strong>Optional late sub (S5 tab):</strong> Brings Charli into H2 for 8 min, Neve exits at 26 min.
  </div>`;
  return html;
}

// ── MAIN ───────────────────────────────────────

function render() {
  renderSegTabs();
  document.getElementById('segStrip').classList.toggle('hidden', activeTab !== 'rotation');
  const mc = document.getElementById('mainContent');
  if (activeTab === 'rotation') mc.innerHTML = renderRotation();
  else if (activeTab === 'subs') mc.innerHTML = renderSubs();
  else mc.innerHTML = renderMinutes();
}

function setSeg(i) {
  activeSeg = i; render();
  const btns = document.querySelectorAll('.seg-btn');
  if (btns[i]) btns[i].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function setTab(tab) {
  activeTab = tab;
  ['Rotation','Subs','Mins'].forEach(t => {
    const id = 'nav' + t;
    const bid = 'bnav' + t;
    const key = t === 'Mins' ? 'minutes' : t.toLowerCase();
    if (document.getElementById(id)) document.getElementById(id).classList.toggle('active', key===tab);
    if (document.getElementById(bid)) document.getElementById(bid).classList.toggle('active', key===tab);
  });
  render();
}

function toggleLate() {
  lateSubOn = !lateSubOn; render();
}

render();
</script>
</body>
</html>
